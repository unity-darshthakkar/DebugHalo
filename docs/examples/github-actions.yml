name: DebugHalo

# Setup once in the consuming repository:
#   npm install --save-dev --save-exact debug-halo
# Commit both package.json and package-lock.json. npm ci then installs that exact locked version.

on:
  pull_request:
  push:

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install project dependencies, including pinned DebugHalo
        run: npm ci
      - name: Generate DebugHalo SARIF
        run: npx debug-halo scan . --format sarif --output debughalo.sarif --fail-on-findings
      - name: Upload DebugHalo SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: debughalo.sarif
          category: debughalo
